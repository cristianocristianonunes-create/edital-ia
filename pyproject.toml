[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edital-ia"
version = "0.1.0"
description = "Leitura e análise de editais de licitação com IA (FastAPI + Claude)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.11", "ruff>=0.6"]
paridade = ["psycopg[binary]>=3.2"]

[tool.setuptools]
packages = ["edital_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["edital_ia"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# prompts precisam ser idênticos aos da versão em produção (o cache da API depende disso)
"edital_ia/ficha.py" = ["E501"]
"tests/test_citacoes.py" = ["E501"]
